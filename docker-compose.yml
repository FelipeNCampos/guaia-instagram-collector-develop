services:
  # ── Banco ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: instagram_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXTERNAL:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - instagram_net

  # ── Instagram Feeder ──────────────────────────────────────────────────────
  feeder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram_feeder
    restart: unless-stopped
    environment:
      # DB
      POSTGRES_HOST:           db
      POSTGRES_PORT:           ${POSTGRES_PORT:-5432}
      POSTGRES_USER:           ${POSTGRES_USER}
      POSTGRES_PASSWORD:       ${POSTGRES_PASSWORD}
      POSTGRES_DB:             ${POSTGRES_DB}
      
      # GuaIA
      INSTAGRAM_QUERY_SOURCE:  ${INSTAGRAM_QUERY_SOURCE}
      
      # Chrome (CRÍTICO)
      CHROME_IN_DOCKER:        "1"
      HEADLESS:                "true"
      DISPLAY:                 ":99"
      
      # Instagram
      INSTAGRAM_POST_WORKERS:              ${INSTAGRAM_POST_WORKERS:-2}
      INSTAGRAM_BLOCK_IMAGES:              "1"
      INSTAGRAM_DISABLE_VISIBLE_MODE:      "1"
      INSTAGRAM_FETCH_COMMENTS:            ${INSTAGRAM_FETCH_COMMENTS:-false}
      INSTAGRAM_COMMENTS_PER_POST:         ${INSTAGRAM_COMMENTS_PER_POST:-50}
      INSTAGRAM_COMMENTS_CONCURRENCY:      ${INSTAGRAM_COMMENTS_CONCURRENCY:-3}
      INSTAGRAM_DOWNLOAD_MEDIA:            ${INSTAGRAM_DOWNLOAD_MEDIA:-false}
      INSTAGRAM_MEDIA_DOWNLOAD_TIMEOUT_SECONDS: ${INSTAGRAM_MEDIA_DOWNLOAD_TIMEOUT_SECONDS:-60}
      INSTAGRAM_MEDIA_MAX_BYTES:           ${INSTAGRAM_MEDIA_MAX_BYTES:-262144000}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:   ${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_DRIVE_FOLDER_ID:              ${GOOGLE_DRIVE_FOLDER_ID:-}

      # 2Captcha (repasse explícito: compose --env-file .env.dev não monta .env.dev em /app/.env)
      TWOCAPTCHA_API_KEY:                  ${TWOCAPTCHA_API_KEY:-}
      INSTAGRAM_USE_GOOGLE_COOKIES_FILE:   ${INSTAGRAM_USE_GOOGLE_COOKIES_FILE:-0}
      TWOCAPTCHA_RECAPTCHA_TIMEOUT:        ${TWOCAPTCHA_RECAPTCHA_TIMEOUT:-600}

    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config.yml:/app/config.yml:ro
      - ./.env:/app/.env:ro
    shm_size: "2gb"           # OBRIGATÓRIO
    security_opt:
      - seccomp:unconfined    # OBRIGATÓRIO
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "4444:4444"           # Selenium debug
      - "7900:7900"           # VNC debug
    networks:
      - instagram_net
    command: ["python", "instagram_api_feeder.py"]

volumes:
  postgres_data:

networks:
  instagram_net:
    driver: bridge
